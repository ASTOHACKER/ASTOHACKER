<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="banner-bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#0c192c" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Glowing Accent Beam -->
    <linearGradient id="brand-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="25%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Radial Glow -->
    <radialGradient id="center-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Structural Matrix Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.07" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>

    <!-- Grid Fade Mask -->
    <linearGradient id="grid-mask-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#fff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0.15" />
    </linearGradient>
    <mask id="grid-mask">
      <rect width="1200" height="260" fill="url(#grid-mask-grad)" />
    </mask>
  </defs>

  <!-- Base Card Surface -->
  <rect width="1200" height="260" rx="16" fill="url(#banner-bg)" />
  <rect width="1200" height="260" rx="16" fill="url(#center-glow)" />

  <!-- Subsurface Architectural Grid -->
  <rect width="1200" height="260" fill="url(#grid-pattern)" mask="url(#grid-mask)" />

  <!-- Outer Precision Border -->
  <rect x="0.5" y="0.5" width="1199" height="259" rx="15.5" stroke="#1e293b" stroke-width="1" />

  <!-- Top Laser Glow Accent -->
  <rect x="250" y="0" width="700" height="2" fill="url(#brand-accent)" />

  <!-- Abstract Systems / Pipeline Motif (Left Wing) -->
  <g opacity="0.32" transform="translate(80, 65)">
    <circle cx="20" cy="20" r="4" fill="#38bdf8" />
    <circle cx="60" cy="55" r="4" fill="#0284c7" />
    <circle cx="20" cy="90" r="4" fill="#38bdf8" />
    <circle cx="100" cy="20" r="3" fill="#0284c7" />
    <circle cx="100" cy="90" r="3" fill="#38bdf8" />
    <path d="M20 20 L60 55 L20 90 M60 55 L100 20 M60 55 L100 90" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3 3" />
    <path d="M0 55 H50" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Abstract AST / Compiler Graph Motif (Right Wing) -->
  <g opacity="0.32" transform="translate(1000, 65)">
    <circle cx="100" cy="20" r="4" fill="#38bdf8" />
    <circle cx="60" cy="55" r="4" fill="#0284c7" />
    <circle cx="100" cy="90" r="4" fill="#38bdf8" />
    <circle cx="20" cy="20" r="3" fill="#0284c7" />
    <circle cx="20" cy="90" r="3" fill="#38bdf8" />
    <path d="M100 20 L60 55 L100 90 M60 55 L20 20 M60 55 L20 90" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3 3" />
    <path d="M70 55 H120" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Typography Content Group (Center-Aligned) -->
  <g text-anchor="middle">
    <!-- Primary Display Heading -->
    <text x="600" y="104" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="0.08em">NARUDOM AOKAT</text>

    <!-- Role & Technical Domain -->
    <text x="600" y="150" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0.03em">Full-Stack Developer  •  Systems &amp; Compiler Enthusiast</text>

    <!-- Motto / Terminal Line -->
    <text x="600" y="194" fill="#94a3b8" font-family="'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="500" letter-spacing="0.02em">
      <tspan fill="#38bdf8" font-weight="700">λ</tspan> "Compile more. Execute less."
    </text>
  </g>

  <!-- Subtle Bottom Code-Bracket Accent Line -->
  <line x1="450" y1="230" x2="750" y2="230" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
</svg>
